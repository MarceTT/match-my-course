name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocking gate: fails the PR if any TypeScript error is introduced.
      # tsc is currently clean on main, so this protects against type regressions
      # (e.g. the duplicate-type bug class we just eliminated).
      - name: Type check
        run: bun run typecheck

  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    # Non-blocking for now: the codebase has pre-existing lint debt
    # (~256 `any`, unused vars). This job surfaces issues without failing the PR.
    # Flip `continue-on-error` to false once the existing debt is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
