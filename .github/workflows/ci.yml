name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # NOTE: not using --frozen-lockfile: package.json uses an npm-style
      # nested "overrides" (cmdk) that Bun does not support, so the frozen
      # check always reports drift against bun.lock. Cleaning up the 3
      # lockfiles + overrides is a separate task.
      - name: Install dependencies
        run: bun install

      # next-env.d.ts is gitignored and declares the ambient module types for
      # static asset imports (png/svg via next/image-types/global). It only
      # exists after `next dev`/`next build` runs, so in clean CI it's absent
      # and tsc reports TS2307 on image imports. The file is a fixed 2-line
      # reference stub, so we regenerate it deterministically before typecheck.
      - name: Generate next-env.d.ts
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      # Blocking gate: fails the PR if any TypeScript error is introduced.
      # tsc is clean on main, so this protects against type regressions
      # (e.g. the duplicate-type bug class we just eliminated).
      - name: Type check
        run: bun run typecheck

  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    # Non-blocking for now: the codebase has pre-existing lint debt
    # (~256 `any`, unused vars). This job surfaces issues without failing the PR.
    # Flip `continue-on-error` to false once the existing debt is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint
