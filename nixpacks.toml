# Force Railway/Nixpacks to build with Bun (matching dev + CI + the backend).
# Bun is the single source of truth for dependencies (bun.lock / bun.lockb).
# The old package-lock.json was removed: Nixpacks used to auto-detect it and
# run `npm ci`, which broke the build when a dep was added via bun (lockfiles
# out of sync). Pinning bun here keeps install/build/start consistent.
[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run start"
