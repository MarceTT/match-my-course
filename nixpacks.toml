# Force Railway/Nixpacks to build with Bun (matching dev + CI + the backend).
# Without this, Nixpacks auto-detects the package manager and picks `npm ci`
# from package-lock.json, which broke the build when a dep was added via bun
# (lockfiles out of sync). Using bun here makes package-lock.json irrelevant
# to the build and keeps a single source of truth (bun.lock / bun.lockb).
[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run start"
